# Add this server block to the Nginx you already run. It does not replace other sites.
# After copying: nginx -t && systemctl reload nginx
# Then point HTTPS at this host the same way you do for your other sites.

server {
    listen 80;
    listen [::]:80;
    server_name infield.ltabai.in;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
